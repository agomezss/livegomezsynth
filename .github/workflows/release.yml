# Publishes the committed firmware package (src/release/latest) as a GitHub Release and as a workflow artifact.
# The package itself is built locally (JieLi toolchain: `python3 tools/package_release.py --build` in src/); this workflow
# refuses to publish when release/latest does not match src/VERSION (tools/check_release.py).
#   push to main        -> release v<VERSION> (replaced when the same version is pushed again) + artifact
#   pull request to main -> check + artifact only (a PR must not create a release)
name: release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the release folder and stage the assets
        run: python3 src/tools/check_release.py --stage out
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/*
          if-no-files-found: error
      - name: Publish the GitHub release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat src/VERSION)
          TAG="v${VERSION}"
          {
            cat out/RELEASE-NOTES.md
            echo
            echo "Flash it from the browser: https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/install/"
            echo
            echo "Always the newest package: \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/latest/download/livegomezsynth-smk37.fwsc\`"
            echo
            echo "Built from commit ${GITHUB_SHA}."
          } > notes.md
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "LiveGomezSynth ${VERSION}" --notes-file notes.md --latest
