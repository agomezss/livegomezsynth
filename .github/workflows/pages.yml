# Publishes src/release/latest/site (simulator at /, installer at /install/) to GitHub Pages.
# The package itself is built locally (JieLi toolchain): run `python3 tools/package_release.py --build` in src/ and commit release/latest.
name: pages
on:
  push:
    branches: [main]
    paths: ["src/release/latest/site/**"]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with: { path: src/release/latest/site }
      - id: deploy
        uses: actions/deploy-pages@v4
